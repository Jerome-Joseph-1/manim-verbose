name: Upload Python Package

# manimgl is pure Python, so one py3-none-any wheel and an sdist serve every platform and
# every Python it supports. (This used to build a wheel per tag, py37 to py310, on Python 3.8,
# against python_requires >= 3.10, and published on drafts too.)

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'

    # The editor's UI is built, not kept in git, and a wheel built without it has an editor
    # with nothing to show
    - name: Look for the editor UI
      id: ui
      run: |
        if [ -f editor-ui/package-lock.json ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
        fi

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: steps.ui.outputs.present == 'true'
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: editor-ui/package-lock.json

    - name: Build the editor UI into manim_verbose/editor/static
      if: steps.ui.outputs.present == 'true'
      working-directory: editor-ui
      run: |
        npm ci
        npm run build

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build the sdist, and the wheel from it
      run: python -m build

    - name: Check what is about to be uploaded
      env:
        UI_BUILT: ${{ steps.ui.outputs.present }}
      run: |
        twine check --strict dist/*
        if [ "$UI_BUILT" = true ]; then
          python tests/packaging/wheel_contents.py dist/*.whl --require-ui
        else
          python tests/packaging/wheel_contents.py dist/*.whl
        fi

    - name: Upload
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: |
        twine upload dist/*
