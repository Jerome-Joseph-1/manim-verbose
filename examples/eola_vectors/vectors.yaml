    do: wait
    duration: 4
  - id: scaling_25
    do: show
    caption: Numbers used this way, like 2, 1/3 and -1.8...
    run_time: 2
    target: [scal_bg, scal_nums]
    style: fade
    lag: 0.3
  - id: scaling_26
    do: wait
    duration: 2
  - id: scaling_27
    do: show
    caption: '...go by the name scalars.'
    run_time: 1.5
    target: scal_word
    style: write
  - id: scaling_28
    do: wait
    duration: 3
  - id: scaling_29
    do: highlight
    caption: Scaling vectors is most of what numbers do in linear algebra...
    run_time: 1.5
    target: scal_word
  - id: scaling_30
    do: wait
    duration: 3.5
  - id: scaling_31
    do: wait
    caption: '...so "scalar" ends up meaning much the same as "number".'
    duration: 4.5
  - id: scaling_32
    do: together
    steps:
    - id: scaling_33
      do: hide
      run_time: 1.5
      target:
      - scal_bg
      - scal_word
      - scal_nums
      - v3
      - v4
      style: fade
    - id: scaling_34
      do: change
      run_time: 1.5
      target: v
      set:
        opacity: 1
  - id: scaling_35
    do: show
    caption: 'In coordinates: 2 times [3, 1] is [6, 2].'
    run_time: 2
    target:
    - n_bg
    - n_2
    - n_v
    - n_eq
    - n_res
    style: fade
  - id: scaling_36
    do: wait
    duration: 4
  - id: scaling_37
    do: wait
    caption: Every coordinate is multiplied by the same scalar.
    duration: 4
  - id: scaling_38
    do: together
    caption: In general, 2 times [x, y] is [2x, 2y].
    steps:
    - id: scaling_39
      do: change
      run_time: 2
      target: n_v
      set:
        entries: [[x], [y]]
    - id: scaling_40
      do: change
      run_time: 2
      target: n_res
      set:
        entries: [[2x], [2y]]
  - id: scaling_41
    do: wait
    duration: 4
  - id: scaling_42
    do: clear
    caption: ''
    run_time: 1.5
- id: wrap_up
  title: Moving between the views, and what's next
  objects:
