      at: [0, -0.8]
    x_range: [-1, 8, 1]
  - id: a2
    type: vector
    color: YELLOW
    tip: [-1.5, -0.3]
    tail: [-3.5, -0.3]
    label: '2'
    label_side: up
  - id: a5
    type: vector
    color: PINK
    tip: [3.5, -0.3]
    tail: [-1.5, -0.3]
    label: '5'
    label_side: up
  - id: a7
    type: vector
    color: ORANGE
    tip: [3.5, 1.2]
    tail: [-3.5, 1.2]
    label: '7'
    label_side: up
  - id: eq27
    type: tex
    place:
      at: [0, 2.9]
    tex: 2 + 5 = 7
    font_size: 60
  steps:
  - id: addition_1
    do: show
    caption: Two operations run through all of linear algebra.
    run_time: 2.5
    target: plane
    style: draw
  - id: addition_2
    do: wait
    duration: 1.5
  - id: addition_3
    do: show
    caption: The first is vector addition.
    run_time: 1.5
    target: [op_bg, op_title]
    style: fade
  - id: addition_4
    do: wait
    duration: 2
  - id: addition_5
    do: show
    caption: Here are two vectors, v and w.
    run_time: 1.5
    target: v
    style: grow
  - id: addition_6
    do: show
    run_time: 1.5
    target: w
    style: grow
  - id: addition_7
    do: wait
    duration: 2
  - id: addition_8
    do: move
    caption: Shift w so that it starts where v ends.
    run_time: 2
    target: w
    by: [1, 2]
  - id: addition_9
    do: wait
    duration: 3
  - id: addition_10
    do: show
    caption: The arrow from v's start to w's new end is the sum.
    run_time: 2
    target: s
    style: grow
  - id: addition_11
    do: wait
    duration: 3
  - id: addition_12
    do: highlight
    caption: We call it v + w.
    run_time: 1.5
    target: s
  - id: addition_13
    do: wait
    duration: 2
  - id: addition_14
    do: together
    caption: The same recipe works for any pair of vectors.
    steps:
    - id: addition_15
      do: change
      run_time: 2
      target: v
      set:
        tip: [-2, 1]
    - id: addition_16
      do: change
      run_time: 2
      target: w
      set:
        tail: [-2, 1]
        tip: [1, 3]
    - id: addition_17
      do: change
      run_time: 2
      target: s
      set:
        tip: [1, 3]
  - id: addition_18
    do: wait
    duration: 3
  - id: addition_19
    do: together
    steps:
    - id: addition_20
      do: change
      run_time: 2
      target: v
      set:
        tip: [1, 2]
    - id: addition_21
      do: change
      run_time: 2
      target: w
      set:
        tail: [1, 2]
        tip: [4, 1]
    - id: addition_22
      do: change
      run_time: 2
      target: s
      set:
        tip: [4, 1]
  - id: addition_23
    do: wait
    caption: But why should addition work like this?
    duration: 4
  - id: addition_24
    do: show
    caption: 'Picture each vector as a trip: go this far, in this direction.'
    run_time: 1
    target: walker
    style: pop
  - id: addition_25
    do: wait
    duration: 4
  - id: addition_26
    do: move
    caption: Make the trip v...
    run_time: 1.5
    target: walker
    to:
      at: [1, 2]
  - id: addition_27
    do: wait
    duration: 1.5
  - id: addition_28
    do: move
    caption: '...then the trip w...'
    run_time: 1.5
    target: walker
    to:
      at: [4, 1]
  - id: addition_29
    do: wait
    duration: 1.5
  - id: addition_30
    do: highlight
    caption: '...lands you where the single trip v + w does.'
    run_time: 1.5
    target: s
    style: flash
  - id: addition_31
    do: wait
    duration: 4
  - id: addition_32
    do: clear
    run_time: 1.5
  - id: addition_33
    do: show
    caption: Numbers on a number line add in just the same way.
    run_time: 2
    target: nline
    style: draw
  - id: addition_34
    do: wait
    duration: 2
  - id: addition_35
    do: show
    caption: Move 2 to the right...
    run_time: 1.5
    target: a2
    style: grow
  - id: addition_36
    do: wait
    duration: 1.5
  - id: addition_37
    do: show
    caption: '...then 5 more...'
    run_time: 2
    target: a5
    style: grow
  - id: addition_38
    do: wait
  - id: addition_39
    do: show
    caption: '...and you are 7 from where you began.'
    run_time: 2
    target: a7
    style: grow
  - id: addition_40
    do: show
    run_time: 1.5
    target: eq27
    style: write
  - id: addition_41
    do: wait
    duration: 3
  - id: addition_42
    do: wait
    caption: Vector addition carries that idea off the line, into the plane.
    duration: 4.5
  - id: addition_43
    do: clear
    run_time: 1.5
