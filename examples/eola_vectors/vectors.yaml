version: 1
title: Vectors, what even are they? (a recreation of the visuals)
settings: {background: BLACK, font: CMU Serif}
scenes:
- id: opening
  title: Title card and opening quote
  objects:
  - {id: rec_title, type: text, text: 'Vectors, what even are they?', font_size: 60, place: [0, 2]}
  - id: rec_sub
    type: text
    text: Essence of linear algebra, chapter 1
    font_size: 36
    color: GREY_A
    place: {next_to: rec_title, buff: 0.35}
  - id: rec_note
    type: text
    text: |-
      A recreation of the visuals of the 3Blue1Brown video,
      made entirely from a manim scene file
    font_size: 30
    color: BLUE_B
    place: {next_to: rec_sub, buff: 0.9}
  - id: rec_credit
    type: text
    text: 'Original video and ideas: 3Blue1Brown (Grant Sanderson)'
    font_size: 26
    color: GREY_B
    place: {next_to: rec_note, buff: 0.5}
  - id: rec_captions
    type: text
    text: Captions written for this recreation stand in for the narration
    font_size: 22
    italic: true
    color: GREY_B
    place: {next_to: rec_credit, buff: 0.3}
  - id: weyl
    type: quote
    text: |-
      The introduction of numbers as coordinates
      is an act of violence.
    author: Hermann Weyl
  steps:
  - {id: opening_1, do: show, target: rec_title, style: write, run_time: 2}
  - {id: opening_2, do: show, target: rec_sub, style: fade_up, run_time: 1}
  - id: opening_3
    do: show
    target: [rec_note, rec_credit, rec_captions]
    style: fade
    lag: 0.4
    run_time: 2
  - {id: opening_4, do: wait, duration: 8}
  - {id: opening_5, do: clear, run_time: 1.5}
  - {id: opening_6, do: show, target: weyl, style: write, run_time: 4}
  - {id: opening_7, do: wait, duration: 10}
  - {id: opening_8, do: clear, run_time: 1.5}
- id: physics_view
  title: Three views of a vector; the physics student
  objects:
  - {id: q_title, type: text, text: 'What is a vector?', place: {edge: top, buff: 0.5}}
  - {id: phys_lbl, type: text, text: Physics student, font_size: 36, place: [-4.7, 1.7]}
  - {id: cs_lbl, type: text, text: Computer science student, font_size: 36, place: [0, 1.7]}
  - {id: math_lbl, type: text, text: Mathematician, font_size: 36, place: [4.7, 1.7]}
  - {id: phys_icon, type: vector, tip: [-3.9, 0.6], tail: [-5.5, -1], color: YELLOW}
  - id: cs_icon
    type: matrix
    entries: [['2{,}600'], ['300{,}000']]
    font_size: 36
    place: [0, -0.2]
  - id: math_icon
    type: tex
    tex: \vec{\mathbf{v}} + \vec{\mathbf{w}} \qquad 2\vec{\mathbf{v}}
    font_size: 44
    place: [4.7, -0.2]
  - {id: arrow, type: vector, tip: [2, 0], tail: [-2, 0], color: YELLOW}
  - {id: len_brace, type: brace, target: arrow, label: '\text{length}', buff: 0.15}
  - id: dir_lbl
    type: text
    text: direction
    font_size: 32
    place: {next_to: arrow, side: right, buff: 0.35}
  - {id: copy_a, type: vector, tip: [-2, 2.4], tail: [-6, 2.4], color: YELLOW}
  - {id: copy_b, type: vector, tip: [6, 1.6], tail: [2, 1.6], color: YELLOW}
  - {id: copy_c, type: vector, tip: [-1, -2], tail: [-5, -2], color: YELLOW}
  - {id: copy_d, type: vector, tip: [5.5, -1.7], tail: [1.5, -1.7], color: YELLOW}
  steps:
  - id: physics_view_1
    do: show
    target: q_title
    style: write
    run_time: 1.5
    caption: Linear algebra is built, from the ground up, on vectors.
  - {id: physics_view_2, do: wait, duration: 3.5}
  - id: physics_view_3
    do: show
    target: [phys_lbl, cs_lbl, math_lbl]
    style: fade
    lag: 0.6
    run_time: 2.5
    caption: Yet there are three quite different ways to picture one.
  - {id: physics_view_4, do: wait, duration: 3}
  - id: physics_view_5
    do: show
    target: phys_icon
    style: grow
    run_time: 1.5
    caption: 'Physics student: an arrow, with a length and a direction.'
  - {id: physics_view_6, do: wait, duration: 3.5}
  - id: physics_view_7
    do: show
    target: cs_icon
    style: write
    run_time: 1.5
    caption: 'Computer science student: numbers listed in a set order.'
  - {id: physics_view_8, do: wait, duration: 3.5}
  - id: physics_view_9
    do: show
    target: math_icon
    style: write
    run_time: 1.5
    caption: 'Mathematician: anything you can add together and scale.'
  - {id: physics_view_10, do: wait, duration: 4}
  - id: physics_view_11
    do: together
    steps:
    - id: physics_view_12
      do: hide
      target: [q_title, cs_lbl, cs_icon, math_lbl, math_icon, phys_icon]
      style: fade
      run_time: 1.5
    - {id: physics_view_13, do: move, target: phys_lbl, to: [0, 3.3], run_time: 1.5}
    caption: We'll look at each in turn, beginning with physics.
  - {id: physics_view_14, do: wait, duration: 3}
  - id: physics_view_15
    do: show
    target: arrow
    style: grow
    run_time: 1.5
    caption: In physics, a vector is drawn as an arrow.
  - {id: physics_view_16, do: wait, duration: 3}
  - id: physics_view_17
    do: show
    target: len_brace
    run_time: 1.5
    caption: 'Two facts settle which arrow it is: how long it is...'
  - {id: physics_view_18, do: wait, duration: 3}
  - id: physics_view_19
    do: together
    steps:
    - {id: physics_view_20, do: show, target: dir_lbl, style: write, run_time: 1.5}
    - {id: physics_view_21, do: highlight, target: arrow, run_time: 1.5}
    caption: '...and which way it points.'
  - {id: physics_view_22, do: wait, duration: 3}
  - {id: physics_view_23, do: hide, target: [len_brace, dir_lbl], style: fade, run_time: 1}
  - id: physics_view_24
    do: move
    target: arrow
    by: [-2.5, 2]
    run_time: 1.5
    caption: Slide it somewhere else without turning or stretching it...
  - {id: physics_view_25, do: move, target: arrow, by: [4.5, -3.5], run_time: 1.5}
  - id: physics_view_26
    do: move
    target: arrow
    by: [-2, 1.5]
    run_time: 1.5
    caption: '...and, as far as physics cares, nothing has changed.'
  - {id: physics_view_27, do: wait, duration: 3}
  - id: physics_view_28
    do: show
    target: [copy_a, copy_b, copy_c, copy_d]
    style: grow
    lag: 0.3
    run_time: 2
    caption: 'Equal length, equal direction: every one of these is the same vector.'
  - {id: physics_view_29, do: wait, duration: 4}
  - id: physics_view_30
    do: wait
    duration: 4.5
    caption: Arrows confined to a flat plane are 2D vectors; in space, 3D.
  - {id: physics_view_31, do: clear, run_time: 1.5}
- id: cs_view
  title: The computer science student
  objects:
  - id: cs_head
    type: text
    text: Computer science student
    font_size: 40
    place: {edge: top, buff: 0.5}
  - id: house_body
    type: square
    fill: TEAL_E
    fill_opacity: 0.6
    color: TEAL_B
    place: [-4.4, -0.6]
  - id: house_roof
    type: polygon
    points: [[-5.7, 0.4], [-3.1, 0.4], [-4.4, 1.7]]
    fill: RED_E
    fill_opacity: 0.6
    color: RED_B
  - id: house_door
    type: rectangle
    width: 0.5
    height: 0.9
    fill: GREY_BROWN
    fill_opacity: 0.8
    color: GREY_A
    place: [-4.4, -1.15]
  - {id: house, type: group, members: [house_body, house_roof, house_door]}
  - {id: feat_area, type: text, text: 'Floor area: 2,600 sq ft', font_size: 32, place: [2.2, 0.8]}
  - id: feat_price
    type: text
    text: 'Price: $300,000'
    font_size: 32
    place: {next_to: feat_area, buff: 0.45}
  - {id: features, type: group, members: [feat_area, feat_price]}
  - id: hvec
    type: matrix
    entries: [['2{,}600 \text{ ft}^2'], ['\$300{,}000']]
    place: [1.1, 0.1]
  - id: lbl_area
    type: text
    text: floor area
    font_size: 28
    color: GREY_A
    place: {next_to: hvec, side: right, buff: 0.5, shift: [0, 0.42]}
  - id: lbl_price
    type: text
    text: price
    font_size: 28
    color: GREY_A
    place: {next_to: hvec, side: right, buff: 0.5, shift: [0, -0.42]}
  - {id: dim_brace, type: brace, target: hvec, side: left, label: '\text{2 entries}', buff: 0.15}
  steps:
  - id: cs_view_1
    do: show
    target: cs_head
    style: write
    run_time: 1.5
    caption: For the computer scientist, a vector is a list of numbers.
  - {id: cs_view_2, do: wait, duration: 4}
  - id: cs_view_3
    do: show
    target: house
    style: draw
    run_time: 2
    caption: Suppose you're studying houses, and record two facts about each.
  - {id: cs_view_4, do: wait, duration: 3.5}
  - id: cs_view_5
    do: show
    target: feat_area
    style: write
    run_time: 1.5
    caption: How much floor space it has...
  - {id: cs_view_6, do: wait, duration: 2}
  - id: cs_view_7
    do: show
    target: feat_price
    style: write
    run_time: 1.5
    caption: '...and what it sells for.'
  - {id: cs_view_8, do: wait, duration: 2}
  - id: cs_view_10
    do: transform
    target: features
    into: hvec
    style: morph
    run_time: 2
    caption: Then every house is summed up by two numbers.
  - {id: cs_view_11, do: show, target: [lbl_area, lbl_price], style: fade, run_time: 1}
  - {id: cs_view_12, do: wait, duration: 3}
  - id: cs_view_13
    do: highlight
    target: hvec
    run_time: 1.5
    caption: In this view, the list itself is the vector.
  - {id: cs_view_14, do: wait, duration: 3}
  - id: cs_view_15
    do: show
    target: dim_brace
    run_time: 1.5
    caption: It has two entries, so it counts as two-dimensional.
  - {id: cs_view_16, do: wait, duration: 4}
  - id: cs_view_17
    do: wait
    duration: 4
    caption: Here, "vector" is really just a grander name for a list.
  - {id: cs_view_18, do: hide, target: dim_brace, style: fade, run_time: 1}
  - id: cs_view_19
    do: change
    target: hvec
    set: {entries: [['\$300{,}000'], ['2{,}600 \text{ ft}^2']]}
    run_time: 2
    caption: Swap the entries and it describes a very strange house.
  - {id: cs_view_20, do: wait, duration: 3.5}
  - id: cs_view_21
    do: change
    target: hvec
    set: {entries: [['2{,}600 \text{ ft}^2'], ['\$300{,}000']]}
    run_time: 1.5
    caption: So the order of the numbers matters.
  - {id: cs_view_22, do: wait, duration: 4}
  - {id: cs_view_23, do: clear, run_time: 1.5}
- id: math_view
  title: The mathematician
  objects:
  - {id: m_head, type: text, text: Mathematician, font_size: 40, place: {edge: top, buff: 0.5}}
  - id: add_tex
    type: tex
    tex: \vec{\mathbf{v}} + \vec{\mathbf{w}}
    font_size: 60
    place: [-3.2, 1.6]
  - {id: scale_tex, type: tex, tex: '2 \cdot \vec{\mathbf{v}}', font_size: 60, place: [3.2, 1.6]}
  - id: add_word
    type: text
    text: adding
    font_size: 30
    color: GREY_A
    place: {next_to: add_tex, buff: 0.35}
  - id: scale_word
    type: text
    text: multiplying by a number
    font_size: 30
    color: GREY_A
    place: {next_to: scale_tex, buff: 0.35}
  - {id: ex_arrow, type: vector, tip: [-3.8, -0.7], tail: [-5.4, -2.3], color: YELLOW}
  - {id: ex_list, type: matrix, entries: [[3], [1]], font_size: 36, place: [0, -1.5]}
  - id: ex_axes
    type: axes
    x_range: [-3, 3, 1]
    y_range: [-1, 1, 1]
    width: 3.2
    height: 1.4
    numbers: false
    place: [4.6, -1.5]
  - {id: ex_graph, type: graph, on: ex_axes, function: sin(2*x), color: BLUE}
  steps:
  - id: math_view_1
    do: show
    target: m_head
    style: write
    run_time: 1.5
    caption: The mathematician tries to capture both views at once.
  - {id: math_view_2, do: wait, duration: 3.5}
  - id: math_view_3
    do: show
    target: [add_tex, add_word]
    style: write
    run_time: 2
    caption: 'What matters is only what you can do with vectors:'
  - {id: math_view_4, do: wait, duration: 3}
  - id: math_view_5
    do: show
    target: [scale_tex, scale_word]
    style: write
    run_time: 2
    caption: add two of them, and multiply one by a number.
  - {id: math_view_6, do: wait, duration: 3.5}
  - id: math_view_7
    do: show
    target: [ex_arrow, ex_list]
    lag: 0.5
    run_time: 2
    caption: Arrows allow both. So do lists of numbers.
  - {id: math_view_8, do: wait, duration: 3}
  - id: math_view_9
    do: show
    target: [ex_axes, ex_graph]
    style: draw
    lag: 0.5
    run_time: 2
    caption: So do stranger things, which turn up later in the series.
  - {id: math_view_10, do: wait, duration: 4}
  - id: math_view_11
    do: wait
    duration: 4.5
    caption: That abstract view can wait. First, connect the other two.
  - {id: math_view_12, do: clear, run_time: 1.5}
- id: coordinate_plane
  title: A coordinate system
  objects:
  - {id: plane, type: number_plane, z: -1}
  - {id: x_axis, type: number_line, x_range: [-7, 7, 1], numbers: false}
  - {id: y_axis, type: number_line, x_range: [-4, 4, 1], numbers: false, rotate: 90}
  - {id: x_name, type: text, text: x-axis, font_size: 30, color: GREEN, place: [6.2, 0.4]}
  - {id: y_name, type: text, text: y-axis, font_size: 30, color: RED, place: [0.9, 3.55]}
  - {id: origin_dot, type: dot, point: [0, 0], radius: 0.09, color: WHITE, z: 2}
  - {id: origin_lbl, type: text, text: origin, font_size: 30, place: [-0.85, -0.45]}
  - {id: unit_seg, type: line, start: [0, 0], end: [1, 0], thickness: 6, color: YELLOW, z: 1}
  - {id: unit_brace, type: brace, target: unit_seg, label: '1', buff: 0.2}
  - {id: v, type: vector, on: plane, tip: [-2, 3], color: YELLOW, z: 1}
  steps:
  - id: coordinate_plane_1
    do: show
    target: x_axis
    style: draw
    run_time: 2
    caption: From here on, vectors will live in a coordinate system.
  - {id: coordinate_plane_2, do: wait, duration: 3}
  - id: coordinate_plane_3
    do: show
    target: x_name
    style: write
    run_time: 1
    caption: 'One line runs across: the x-axis.'
  - {id: coordinate_plane_4, do: wait, duration: 3}
  - id: coordinate_plane_5
    do: together
    steps:
    - {id: coordinate_plane_6, do: show, target: y_axis, style: draw, run_time: 2}
    - {id: coordinate_plane_7, do: show, target: y_name, style: write, run_time: 1}
    caption: 'Another runs straight up: the y-axis.'
  - {id: coordinate_plane_8, do: wait, duration: 2}
  - id: coordinate_plane_9
    do: show
    target: origin_dot
    style: pop
    run_time: 1
    caption: They meet at the origin, the centre of it all.
  - {id: coordinate_plane_10, do: show, target: origin_lbl, style: write, run_time: 1}
  - {id: coordinate_plane_11, do: highlight, target: origin_dot, style: flash, run_time: 1.5}
  - {id: coordinate_plane_12, do: wait, duration: 2}
  - id: coordinate_plane_13
    do: together
    steps:
    - {id: coordinate_plane_14, do: show, target: unit_seg, style: draw, run_time: 1.5}
    - {id: coordinate_plane_15, do: show, target: unit_brace, run_time: 1.5}
    caption: Tick marks along each axis are one unit apart.
  - {id: coordinate_plane_16, do: wait, duration: 3.5}
  - id: coordinate_plane_17
    do: wait
    duration: 4
    caption: You choose how long a unit is, then stick with it.
  - id: coordinate_plane_18
    do: hide
    target: [unit_seg, unit_brace, origin_lbl]
    style: fade
    run_time: 1
  - id: coordinate_plane_19
    do: show
    target: plane
    style: draw
    run_time: 3
    caption: A grid line through every tick makes positions easy to read.
  - {id: coordinate_plane_20, do: wait, duration: 3}
  - id: coordinate_plane_21
    do: show
    target: v
    style: grow
    run_time: 2
    caption: Now draw a vector here, starting from the origin.
  - {id: coordinate_plane_22, do: wait, duration: 3.5}
  - id: coordinate_plane_23
    do: wait
    duration: 4.5
    caption: Unlike the physicist's arrows, this one's tail stays put at the origin.
  - {id: coordinate_plane_24, do: hide, target: [x_name, y_name], style: fade, run_time: 1}
- id: coordinates
  title: Coordinates as instructions
  objects:
  - {id: plane, type: number_plane, z: -1, shown: true}
  - {id: x_axis, type: number_line, x_range: [-7, 7, 1], numbers: false, shown: true}
  - {id: y_axis, type: number_line, x_range: [-4, 4, 1], numbers: false, shown: true, rotate: 90}
  - {id: origin_dot, type: dot, point: [0, 0], radius: 0.09, color: WHITE, z: 2, shown: true}
  - {id: v, type: vector, on: plane, tip: [-2, 3], color: YELLOW, z: 1, shown: true}
  - {id: coords, type: matrix, entries: [[-2], [3]], row_colors: [GREEN, RED], place: [-3.5, 3]}
  - id: x_step
    type: line
    on: plane
    start: [0, 0]
    end: [-2, 0]
    arrow: true
    color: GREEN
    z: 1
  - {id: y_step, type: line, on: plane, start: [-2, 0], end: [-2, 3], arrow: true, color: RED, z: 1}
  - {id: x_num, type: tex, tex: '-2', font_size: 40, color: GREEN, place: [-1, -0.45]}
  - {id: y_num, type: tex, tex: '3', font_size: 40, color: RED, place: [-2.4, 1.5]}
  steps:
  - id: coordinates_1
    do: show
    target: coords
    style: write
    run_time: 1.5
    caption: This vector's coordinates are the numbers -2 and 3.
  - {id: coordinates_2, do: wait, duration: 3.5}
  - id: coordinates_3
    do: highlight
    target: coords
    run_time: 1.5
    caption: They are a recipe for getting from the tail to the tip.
  - {id: coordinates_4, do: wait, duration: 3.5}
  - id: coordinates_5
    do: wait
    duration: 4.5
    caption: Stacking them in a column keeps vectors apart from points.
  - id: coordinates_6
    do: show
    target: x_step
    style: draw
    run_time: 1.5
    caption: The top entry is a distance along the x-axis.
  - {id: coordinates_7, do: show, target: x_num, style: write, run_time: 1}
  - {id: coordinates_8, do: wait, duration: 2}
  - {id: coordinates_9, do: wait, duration: 4, caption: 'It''s negative, so head left: two units.'}
  - id: coordinates_10
    do: show
    target: y_step
    style: draw
    run_time: 1.5
    caption: 'The bottom entry: then travel parallel to the y-axis.'
  - {id: coordinates_11, do: show, target: y_num, style: write, run_time: 1}
  - {id: coordinates_12, do: wait, duration: 2}
  - {id: coordinates_13, do: wait, duration: 4, caption: 'It''s positive, so head up: three units.'}
  - id: coordinates_14
    do: highlight
    target: v
    run_time: 1.5
    caption: The trip ends right at the tip of the arrow.
  - {id: coordinates_15, do: wait, duration: 3.5}
  - id: coordinates_16
    do: hide
    target: [x_step, y_step, x_num, y_num]
    style: fade
    run_time: 1
    caption: Any pair of numbers picks out a single vector...
  - id: coordinates_17
    do: together
    steps:
    - {id: coordinates_18, do: change, target: v, set: {tip: [3, 1]}, run_time: 2}
    - id: coordinates_19
      do: change
      target: coords
      set: {entries: [[3], [1]], place: [4.2, 2]}
      run_time: 2
  - {id: coordinates_20, do: wait, duration: 2}
  - id: coordinates_21
    do: together
    steps:
    - {id: coordinates_22, do: change, target: v, set: {tip: [4, -1]}, run_time: 2}
    - id: coordinates_23
      do: change
      target: coords
      set: {entries: [[4], [-1]], place: [5.2, -1.7]}
      run_time: 2
    caption: '...and any vector hands back a single pair.'
  - {id: coordinates_24, do: wait, duration: 2}
  - id: coordinates_25
    do: together
    steps:
    - {id: coordinates_26, do: change, target: v, set: {tip: [-4, -2]}, run_time: 2}
    - id: coordinates_27
      do: change
      target: coords
      set: {entries: [[-4], [-2]], place: [-5.2, -1.2]}
      run_time: 2
    caption: Move the tip anywhere, and the numbers follow it.
  - {id: coordinates_28, do: wait, duration: 2}
  - id: coordinates_29
    do: together
    steps:
    - {id: coordinates_30, do: change, target: v, set: {tip: [-2, 3]}, run_time: 2}
    - id: coordinates_31
      do: change
      target: coords
      set: {entries: [[-2], [3]], place: [-3.5, 3]}
      run_time: 2
    caption: Pairs of numbers and 2D arrows match up one to one.
  - {id: coordinates_32, do: wait, duration: 4}
  - {id: coordinates_33, do: clear, run_time: 1.5, caption: ''}
- id: three_d
  title: Three dimensions
  objects:
  - {id: floor, type: number_plane, x_range: [-4, 4, 1], faded: true}
  - {id: axes3, type: axes_3d, x_range: [-4, 4, 1], y_range: [-4, 4, 1], z_range: [-4, 4, 1]}
  - {id: xs, type: line, on: axes3, start: [0, 0, 0], end: [2, 0, 0], arrow: true, color: GREEN}
  - {id: ys, type: line, on: axes3, start: [2, 0, 0], end: [2, 1, 0], arrow: true, color: RED}
  - {id: zs, type: line, on: axes3, start: [2, 1, 0], end: [2, 1, 3], arrow: true, color: BLUE}
  - {id: v3, type: vector, on: axes3, tip: [2, 1, 3], tail: [0, 0, 0], color: YELLOW}
  steps:
  - id: three_d_1
    do: show
    target: [floor, axes3]
    style: draw
    run_time: 2.5
    caption: So far, everything has lived in a flat plane.
  - {id: three_d_2, do: wait, duration: 3}
  - id: three_d_3
    do: camera
    orientation: [-30, 70]
    run_time: 3.5
    caption: A new axis, z, stands at right angles to the other two.
  - {id: three_d_4, do: wait, duration: 3}
  - id: three_d_5
    do: wait
    duration: 4.5
    caption: Now a vector needs three numbers, for example 2, 1 and 3.
  - id: three_d_6
    do: show
    target: xs
    style: draw
    run_time: 1.5
    caption: '2: two units along the x-axis...'
  - {id: three_d_7, do: wait, duration: 2}
  - id: three_d_8
    do: show
    target: ys
    style: draw
    run_time: 1.5
    caption: '1: one unit parallel to the y-axis...'
  - {id: three_d_9, do: wait, duration: 2}
  - id: three_d_10
    do: show
    target: zs
    style: draw
    run_time: 1.5
    caption: '3: three units up, parallel to the z-axis.'
  - {id: three_d_11, do: wait, duration: 2}
  - id: three_d_12
    do: show
    target: v3
    style: grow
    run_time: 2
    caption: The vector [2, 1, 3] ends where those moves end.
  - {id: three_d_13, do: wait, duration: 3}
  - id: three_d_14
    do: camera
    orientation: [20, 70]
    run_time: 6
    caption: Every list of three numbers gives one arrow in space...
  - id: three_d_15
    do: wait
    duration: 4.5
    caption: '...and every arrow in space gives back one such list.'
  - {id: three_d_16, do: hide, target: [xs, ys, zs], style: fade, run_time: 1}
  - id: three_d_17
    do: change
    target: v3
    set: {tip: [-3, 2, 1]}
    run_time: 2
    caption: Change the numbers, and you get a different arrow.
  - {id: three_d_18, do: wait, duration: 2}
  - {id: three_d_19, do: change, target: v3, set: {tip: [1, -3, 2]}, run_time: 2}
  - id: three_d_20
    do: camera
    orientation: [-40, 75]
    run_time: 5
    caption: A third coordinate is all it takes to reach into space.
  - {id: three_d_21, do: wait, duration: 1.5}
  - {id: three_d_22, do: clear, run_time: 1.5, caption: ''}
- id: addition
  title: Adding vectors, and why tip to tail
  objects:
  - {id: plane, type: number_plane, z: -1}
  - id: op_title
    type: text
    text: Vector addition
    font_size: 40
    z: 2
    place: {edge: top_left, buff: 0.4}
  - {id: op_bg, type: box, target: op_title, fill_opacity: 0.85, color: BLACK, z: 1}
  - id: v
    type: vector
    on: plane
    tip: [1, 2]
    label: \vec{\mathbf{v}}
    label_side: left
    color: YELLOW
  - id: w
    type: vector
    on: plane
    tip: [3, -1]
    label: \vec{\mathbf{w}}
    label_side: up
    color: PINK
  - id: s
    type: vector
    on: plane
    tip: [4, 1]
    label: \vec{\mathbf{v}} + \vec{\mathbf{w}}
    color: ORANGE
  - {id: walker, type: dot, point: [0, 0], radius: 0.12, color: WHITE, z: 3}
  - {id: nline, type: number_line, x_range: [-1, 8, 1], place: [0, -0.8]}
  - id: a2
    type: vector
    tip: [-1.5, -0.3]
    tail: [-3.5, -0.3]
    label: '2'
    label_side: up
    color: YELLOW
  - id: a5
    type: vector
    tip: [3.5, -0.3]
    tail: [-1.5, -0.3]
    label: '5'
    label_side: up
    color: PINK
  - id: a7
    type: vector
    tip: [3.5, 1.2]
    tail: [-3.5, 1.2]
    label: '7'
    label_side: up
    color: ORANGE
  - {id: eq27, type: tex, tex: 2 + 5 = 7, font_size: 60, place: [0, 2.9]}
  steps:
  - id: addition_1
    do: show
    target: plane
    style: draw
    run_time: 2.5
    caption: Two operations run through all of linear algebra.
  - {id: addition_2, do: wait, duration: 1.5}
  - id: addition_3
    do: show
    target: [op_bg, op_title]
    style: fade
    run_time: 1.5
    caption: The first is vector addition.
  - {id: addition_4, do: wait, duration: 2}
  - id: addition_5
    do: show
    target: v
    style: grow
    run_time: 1.5
    caption: Here are two vectors, v and w.
  - {id: addition_6, do: show, target: w, style: grow, run_time: 1.5}
  - {id: addition_7, do: wait, duration: 2}
  - id: addition_8
    do: move
    target: w
    by: [1, 2]
    run_time: 2
    caption: Shift w so that it starts where v ends.
  - {id: addition_9, do: wait, duration: 3}
  - id: addition_10
    do: show
    target: s
    style: grow
    run_time: 2
    caption: The arrow from v's start to w's new end is the sum.
  - {id: addition_11, do: wait, duration: 3}
  - {id: addition_12, do: highlight, target: s, run_time: 1.5, caption: We call it v + w.}
  - {id: addition_13, do: wait, duration: 2}
  - id: addition_14
    do: together
    steps:
    - {id: addition_15, do: change, target: v, set: {tip: [-2, 1]}, run_time: 2}
    - {id: addition_16, do: change, target: w, set: {tail: [-2, 1], tip: [1, 3]}, run_time: 2}
    - {id: addition_17, do: change, target: s, set: {tip: [1, 3]}, run_time: 2}
    caption: The same recipe works for any pair of vectors.
  - {id: addition_18, do: wait, duration: 3}
  - id: addition_19
    do: together
    steps:
    - {id: addition_20, do: change, target: v, set: {tip: [1, 2]}, run_time: 2}
    - {id: addition_21, do: change, target: w, set: {tail: [1, 2], tip: [4, 1]}, run_time: 2}
    - {id: addition_22, do: change, target: s, set: {tip: [4, 1]}, run_time: 2}
  - {id: addition_23, do: wait, duration: 4, caption: 'But why should addition work like this?'}
  - id: addition_24
    do: show
    target: walker
    style: pop
    run_time: 1
    caption: 'Picture each vector as a trip: go this far, in this direction.'
  - {id: addition_25, do: wait, duration: 4}
  - id: addition_26
    do: move
    target: walker
    to: [1, 2]
    run_time: 1.5
    caption: Make the trip v...
  - {id: addition_27, do: wait, duration: 1.5}
  - id: addition_28
    do: move
    target: walker
    to: [4, 1]
    run_time: 1.5
    caption: '...then the trip w...'
  - {id: addition_29, do: wait, duration: 1.5}
  - id: addition_30
    do: highlight
    target: s
    style: flash
    run_time: 1.5
    caption: '...lands you where the single trip v + w does.'
  - {id: addition_31, do: wait, duration: 4}
  - {id: addition_32, do: clear, run_time: 1.5}
  - id: addition_33
    do: show
    target: nline
    style: draw
    run_time: 2
    caption: Numbers on a number line add in just the same way.
  - {id: addition_34, do: wait, duration: 2}
  - id: addition_35
    do: show
    target: a2
    style: grow
    run_time: 1.5
    caption: Move 2 to the right...
  - {id: addition_36, do: wait, duration: 1.5}
  - {id: addition_37, do: show, target: a5, style: grow, run_time: 2, caption: '...then 5 more...'}
  - {id: addition_38, do: wait}
  - id: addition_39
    do: show
    target: a7
    style: grow
    run_time: 2
    caption: '...and you are 7 from where you began.'
  - {id: addition_40, do: show, target: eq27, style: write, run_time: 1.5}
  - {id: addition_41, do: wait, duration: 3}
  - id: addition_42
    do: wait
    duration: 4.5
    caption: Vector addition carries that idea off the line, into the plane.
  - {id: addition_43, do: clear, run_time: 1.5}
- id: addition_numbers
  title: Adding vectors with coordinates
  objects:
  - {id: plane, type: number_plane, z: -1}
  - id: v
    type: vector
    on: plane
    tip: [1, 2]
    label: \vec{\mathbf{v}}
    label_side: left
    color: YELLOW
  - {id: w, type: vector, on: plane, tip: [4, 1], tail: [1, 2], color: PINK}
  - id: s
    type: vector
    on: plane
    tip: [4, 1]
    label: \vec{\mathbf{v}} + \vec{\mathbf{w}}
    color: ORANGE
  - {id: vx, type: line, on: plane, start: [0, 0], end: [1, 0], arrow: true, color: GREEN, z: 1}
  - {id: vy, type: line, on: plane, start: [1, 0], end: [1, 2], arrow: true, color: RED, z: 1}
  - {id: wx, type: line, on: plane, start: [1, 2], end: [4, 2], arrow: true, color: GREEN, z: 1}
  - {id: wy, type: line, on: plane, start: [4, 2], end: [4, 1], arrow: true, color: RED, z: 1}
  - {id: e_v, type: matrix, entries: [[1], [2]], font_size: 36, row_colors: [GREEN, RED], z: 2}
  - {id: e_plus, type: tex, tex: +, font_size: 40, z: 2}
  - {id: e_w, type: matrix, entries: [[3], [-1]], font_size: 36, row_colors: [GREEN, RED], z: 2}
  - {id: e_eq1, type: tex, tex: '=', font_size: 40, z: 2}
  - id: e_mid
    type: matrix
    entries: [[1 + 3], [2 + (-1)]]
    font_size: 36
    row_colors: [GREEN, RED]
    z: 2
  - {id: e_eq2, type: tex, tex: '=', font_size: 40, z: 2}
  - {id: e_res, type: matrix, entries: [[4], [1]], font_size: 36, row_colors: [GREEN, RED], z: 2}
  - id: eq_row
    type: group
    members: [e_v, e_plus, e_w, e_eq1, e_mid, e_eq2, e_res]
    arrange: row
    buff: 0.2
    place: {edge: top_left, buff: 0.4}
  - {id: eq_bg, type: box, target: eq_row, fill_opacity: 0.85, color: BLACK, z: 1}
  - id: gen
    type: tex
    tex: \begin{bmatrix} x_1 \\ y_1 \end{bmatrix} + \begin{bmatrix} x_2 \\ y_2 \end{bmatrix} = \begin{bmatrix} x_1 + x_2 \\ y_1 + y_2 \end{bmatrix}
    font_size: 36
    colors: {x_1: GREEN, x_2: GREEN, y_1: RED, y_2: RED}
    z: 2
    place: [-3.6, -1.6]
  - {id: gen_bg, type: box, target: gen, fill_opacity: 0.85, color: BLACK, z: 1}
  steps:
  - id: addition_numbers_1
    do: show
    target: plane
    style: fade
    run_time: 1.5
    caption: What does adding vectors look like in coordinates?
  - {id: addition_numbers_2, do: show, target: [v, w], style: grow, lag: 0.5, run_time: 2}
  - {id: addition_numbers_3, do: wait, duration: 2}
  - id: addition_numbers_4
    do: show
    target: [eq_bg, e_v, e_plus, e_w]
    style: fade
    run_time: 1.5
    caption: Let v be [1, 2], and let w be [3, -1].
  - {id: addition_numbers_5, do: wait, duration: 4}
  - id: addition_numbers_6
    do: show
    target: [vx, vy]
    style: draw
    lag: 1
    run_time: 2
    caption: 'To follow v: one unit right, then two units up.'
  - {id: addition_numbers_7, do: wait, duration: 3}
  - id: addition_numbers_8
    do: show
    target: [wx, wy]
    style: draw
    lag: 1
    run_time: 2
    caption: 'To follow w: three units right, then one unit down.'
  - {id: addition_numbers_9, do: wait, duration: 3}
  - id: addition_numbers_10
    do: together
    steps:
    - {id: addition_numbers_11, do: move, target: wx, by: [0, -2], run_time: 2}
    - {id: addition_numbers_12, do: move, target: vy, by: [3, 0], run_time: 2}
    caption: Gather the sideways moves, and the up-and-down moves.
  - {id: addition_numbers_13, do: wait, duration: 3.5}
  - id: addition_numbers_14
    do: show
    target: [e_eq1, e_mid]
    style: write
    run_time: 2
    caption: Sideways, 1 then 3. Vertically, 2 then -1.
  - {id: addition_numbers_15, do: wait, duration: 4}
  - id: addition_numbers_16
    do: show
    target: [e_eq2, e_res]
    style: write
    run_time: 1.5
    caption: 'Altogether: 4 across and 1 up.'
  - {id: addition_numbers_17, do: show, target: s, style: grow, run_time: 1.5}
  - {id: addition_numbers_18, do: wait, duration: 2}
  - id: addition_numbers_19
    do: highlight
    target: e_res
    run_time: 1.5
    caption: So v + w has coordinates [4, 1].
  - {id: addition_numbers_20, do: wait, duration: 3.5}
  - id: addition_numbers_21
    do: show
    target: [gen_bg, gen]
    style: fade
    run_time: 2
    caption: In general, add the first entries, then add the second entries.
  - {id: addition_numbers_22, do: wait, duration: 4}
  - id: addition_numbers_23
    do: highlight
    target: gen
    part: x_1 + x_2
    color: GREEN
    run_time: 1.5
    caption: The x-coordinates combine into the new x...
  - {id: addition_numbers_24, do: wait, duration: 2}
  - id: addition_numbers_25
    do: highlight
    target: gen
    part: y_1 + y_2
    color: RED
    run_time: 1.5
    caption: '...and the y-coordinates into the new y.'
  - {id: addition_numbers_26, do: wait, duration: 3}
  - {id: addition_numbers_27, do: clear, run_time: 1.5}
- id: scaling
  title: Scaling, and what a scalar is
  objects:
  - {id: plane, type: number_plane, z: -1}
  - id: v
    type: vector
    on: plane
    tip: [3, 1]
    label: \vec{\mathbf{v}}
    label_side: down
    color: YELLOW
  - id: v2
    type: vector
    on: plane
    tip: [6, 2]
    label: 2\vec{\mathbf{v}}
    label_side: up
    color: YELLOW
    z: 1
  - id: v3
    type: vector
    on: plane
    tip: [1, 0.3333]
    label: \tfrac{1}{3}\vec{\mathbf{v}}
    label_side: up
    color: YELLOW
    z: 1
  - id: v4
    type: vector
    on: plane
    tip: [-5.4, -1.8]
    label: -1.8\vec{\mathbf{v}}
    label_side: left
    color: YELLOW
    z: 1
  - {id: scal_word, type: text, text: Scalars, font_size: 44, color: YELLOW, z: 2}
  - {id: s_2, type: tex, tex: '2', font_size: 44, z: 2}
  - {id: s_third, type: tex, tex: '\tfrac{1}{3}', font_size: 44, z: 2}
  - {id: s_neg, type: tex, tex: '-1.8', font_size: 44, z: 2}
  - {id: scal_nums, type: group, members: [s_2, s_third, s_neg], arrange: row, buff: 0.7}
  - id: scal_all
    type: group
    members: [scal_word, scal_nums]
    arrange: column
    buff: 0.3
    place: [-4.6, 2.7]
  - {id: scal_bg, type: box, target: scal_all, fill_opacity: 0.85, color: BLACK, z: 1}
  - {id: n_2, type: tex, tex: 2 \cdot, font_size: 40, z: 2}
  - {id: n_v, type: matrix, entries: [[3], [1]], font_size: 36, row_colors: [GREEN, RED], z: 2}
  - {id: n_eq, type: tex, tex: '=', font_size: 40, z: 2}
  - {id: n_res, type: matrix, entries: [[6], [2]], font_size: 36, row_colors: [GREEN, RED], z: 2}
  - id: n_row
    type: group
    members: [n_2, n_v, n_eq, n_res]
    arrange: row
    buff: 0.2
    place: {edge: top_left, buff: 0.5}
  - {id: n_bg, type: box, target: n_row, fill_opacity: 0.85, color: BLACK, z: 1}
  steps:
  - id: scaling_1
    do: show
    target: plane
    style: draw
    run_time: 2
    caption: 'The second operation: multiplying a vector by a number.'
  - {id: scaling_2, do: show, target: v, style: grow, run_time: 1.5}
  - {id: scaling_3, do: wait, duration: 2}
  - id: scaling_4
    do: together
    steps:
    - {id: scaling_5, do: transform, target: v, into: v2, keep: true, run_time: 2}
    - {id: scaling_6, do: change, target: v, set: {opacity: 0.35}, run_time: 2}
    caption: Multiply by 2, and the arrow grows to twice its length.
  - {id: scaling_7, do: wait, duration: 4}
  - id: scaling_8
    do: together
    steps:
    - {id: scaling_9, do: hide, target: v2, style: fade, run_time: 1}
    - {id: scaling_10, do: change, target: v, set: {opacity: 1}, run_time: 1}
  - id: scaling_11
    do: together
    steps:
    - {id: scaling_12, do: transform, target: v, into: v3, keep: true, run_time: 2}
    - {id: scaling_13, do: change, target: v, set: {opacity: 0.35}, run_time: 2}
    caption: Multiply by 1/3, and it shrinks to a third as long.
  - {id: scaling_14, do: wait, duration: 4}
  - id: scaling_15
    do: together
    steps:
    - {id: scaling_16, do: hide, target: v3, style: fade, run_time: 1}
    - {id: scaling_17, do: change, target: v, set: {opacity: 1}, run_time: 1}
  - id: scaling_18
    do: together
    steps:
    - {id: scaling_19, do: transform, target: v, into: v4, keep: true, run_time: 2.5}
    - {id: scaling_20, do: change, target: v, set: {opacity: 0.35}, run_time: 2.5}
    caption: 'Multiply by -1.8: it turns to face the other way...'
  - {id: scaling_21, do: wait, duration: 1.5}
  - {id: scaling_22, do: wait, duration: 4, caption: '...and ends up 1.8 times as long.'}
  - id: scaling_23
    do: show
    target: [v2, v3]
    style: fade
    run_time: 1.5
    caption: 'Stretching, shrinking, reversing: together, these are called scaling.'
  - {id: scaling_24, do: wait, duration: 4}
  - id: scaling_25
    do: show
    target: [scal_bg, scal_nums]
    style: fade
    lag: 0.3
    run_time: 2
    caption: Numbers used this way, like 2, 1/3 and -1.8...
  - {id: scaling_26, do: wait, duration: 2}
  - id: scaling_27
    do: show
    target: scal_word
    style: write
    run_time: 1.5
    caption: '...go by the name scalars.'
  - {id: scaling_28, do: wait, duration: 3}
  - id: scaling_29
    do: highlight
    target: scal_word
    run_time: 1.5
    caption: Scaling vectors is most of what numbers do in linear algebra...
  - {id: scaling_30, do: wait, duration: 3.5}
  - id: scaling_31
    do: wait
    duration: 4.5
    caption: '...so "scalar" ends up meaning much the same as "number".'
  - id: scaling_32
    do: together
    steps:
    - id: scaling_33
      do: hide
      target: [scal_bg, scal_word, scal_nums, v3, v4]
      style: fade
      run_time: 1.5
    - {id: scaling_34, do: change, target: v, set: {opacity: 1}, run_time: 1.5}
  - id: scaling_35
    do: show
    target: [n_bg, n_2, n_v, n_eq, n_res]
    style: fade
    run_time: 2
    caption: 'In coordinates: 2 times [3, 1] is [6, 2].'
  - {id: scaling_36, do: wait, duration: 4}
  - id: scaling_37
    do: wait
    duration: 4
    caption: Every coordinate is multiplied by the same scalar.
  - id: scaling_38
    do: together
    steps:
    - {id: scaling_39, do: change, target: n_v, set: {entries: [[x], [y]]}, run_time: 2}
    - {id: scaling_40, do: change, target: n_res, set: {entries: [[2x], [2y]]}, run_time: 2}
    caption: In general, 2 times [x, y] is [2x, 2y].
  - {id: scaling_41, do: wait, duration: 4}
  - {id: scaling_42, do: clear, run_time: 1.5, caption: ''}
