version: 1
title: Vectors, what even are they? (a recreation of the visuals)
settings:
  background: BLACK
scenes:
- id: opening
  title: Title card and opening quote
  objects:
  - id: rec_title
    type: text
    place:
      at: [0, 2]
    text: Vectors, what even are they?
    font_size: 60
  - id: rec_sub
    type: text
    color: GREY_A
    place:
      next_to: rec_title
      buff: 0.35
    text: Essence of linear algebra, chapter 1
    font_size: 36
  - id: rec_note
    type: text
    color: BLUE_B
    place:
      next_to: rec_sub
      buff: 0.9
    text: |-
      A recreation of the visuals of the 3Blue1Brown video,
      made entirely from a manim scene file
    font_size: 30
  - id: rec_credit
    type: text
    color: GREY_B
    place:
      next_to: rec_note
      buff: 0.5
    text: 'Original video and ideas: 3Blue1Brown (Grant Sanderson)'
    font_size: 26
  - id: rec_captions
    type: text
    color: GREY_B
    place:
      next_to: rec_credit
      buff: 0.3
    text: Captions written for this recreation stand in for the narration
    font_size: 22
    italic: true
  - id: weyl
    type: quote
    text: |-
      The introduction of numbers as coordinates
      is an act of violence.
    author: Hermann Weyl
  steps:
  - id: opening_1
    do: show
    run_time: 2
    target: rec_title
    style: write
  - id: opening_2
    do: show
    run_time: 1
    target: rec_sub
    style: fade_up
  - id: opening_3
    do: show
    run_time: 2
    target: [rec_note, rec_credit, rec_captions]
    style: fade
    lag: 0.4
  - id: opening_4
    do: wait
    duration: 8
  - id: opening_5
    do: clear
    run_time: 1.5
  - id: opening_6
    do: show
    run_time: 4
    target: weyl
    style: write
  - id: opening_7
    do: wait
    duration: 10
  - id: opening_8
    do: clear
    run_time: 1.5
- id: physics_view
  title: Three views of a vector; the physics student
  objects:
  - id: q_title
    type: text
    place:
      edge: top
      buff: 0.5
    text: What is a vector?
  - id: phys_lbl
    type: text
    place:
      at: [-4.7, 1.7]
    text: Physics student
    font_size: 36
  - id: cs_lbl
    type: text
    place:
      at: [0, 1.7]
    text: Computer science student
    font_size: 36
  - id: math_lbl
    type: text
    place:
      at: [4.7, 1.7]
    text: Mathematician
    font_size: 36
  - id: phys_icon
    type: vector
    color: YELLOW
    tip: [-3.9, 0.6]
    tail: [-5.5, -1]
  - id: cs_icon
    type: matrix
    place:
      at: [0, -0.2]
    entries: [['2{,}600'], ['300{,}000']]
    font_size: 36
  - id: math_icon
    type: tex
    place:
      at: [4.7, -0.2]
    tex: \vec{\mathbf{v}} + \vec{\mathbf{w}} \qquad 2\vec{\mathbf{v}}
    font_size: 44
  - id: arrow
    type: vector
    color: YELLOW
    tip: [2, 0]
    tail: [-2, 0]
  - id: len_brace
    type: brace
    target: arrow
    label: \text{length}
    buff: 0.15
  - id: dir_lbl
    type: text
    place:
      next_to: arrow
      side: right
      buff: 0.35
    text: direction
    font_size: 32
  - id: copy_a
    type: vector
    color: YELLOW
    tip: [-2, 2.4]
    tail: [-6, 2.4]
  - id: copy_b
    type: vector
    color: YELLOW
    tip: [6, 1.6]
    tail: [2, 1.6]
  - id: copy_c
    type: vector
    color: YELLOW
    tip: [-1, -2]
    tail: [-5, -2]
  - id: copy_d
    type: vector
    color: YELLOW
    tip: [5.5, -1.7]
    tail: [1.5, -1.7]
  steps:
  - id: physics_view_1
    do: show
    caption: Linear algebra is built, from the ground up, on vectors.
    run_time: 1.5
    target: q_title
    style: write
  - id: physics_view_2
    do: wait
    duration: 3.5
  - id: physics_view_3
    do: show
    caption: Yet there are three quite different ways to picture one.
    run_time: 2.5
    target: [phys_lbl, cs_lbl, math_lbl]
    style: fade
    lag: 0.6
  - id: physics_view_4
    do: wait
    duration: 3
  - id: physics_view_5
    do: show
    caption: 'Physics student: an arrow, with a length and a direction.'
    run_time: 1.5
    target: phys_icon
    style: grow
  - id: physics_view_6
    do: wait
    duration: 3.5
  - id: physics_view_7
    do: show
    caption: 'Computer science student: numbers listed in a set order.'
    run_time: 1.5
    target: cs_icon
    style: write
  - id: physics_view_8
    do: wait
    duration: 3.5
  - id: physics_view_9
    do: show
    caption: 'Mathematician: anything you can add together and scale.'
    run_time: 1.5
    target: math_icon
    style: write
  - id: physics_view_10
    do: wait
    duration: 4
  - id: physics_view_11
    do: together
    caption: We'll look at each in turn, beginning with physics.
    steps:
    - id: physics_view_12
      do: hide
      run_time: 1.5
      target:
      - q_title
      - cs_lbl
      - cs_icon
      - math_lbl
      - math_icon
      - phys_icon
      style: fade
    - id: physics_view_13
      do: move
      run_time: 1.5
      target: phys_lbl
      to:
        at: [0, 3.3]
  - id: physics_view_14
    do: wait
    duration: 3
  - id: physics_view_15
    do: show
    caption: In physics, a vector is drawn as an arrow.
    run_time: 1.5
    target: arrow
    style: grow
  - id: physics_view_16
    do: wait
    duration: 3
  - id: physics_view_17
    do: show
    caption: 'Two facts settle which arrow it is: how long it is...'
    run_time: 1.5
    target: len_brace
  - id: physics_view_18
    do: wait
    duration: 3
  - id: physics_view_19
    do: together
    caption: '...and which way it points.'
    steps:
    - id: physics_view_20
      do: show
      run_time: 1.5
      target: dir_lbl
      style: write
    - id: physics_view_21
      do: highlight
      run_time: 1.5
      target: arrow
  - id: physics_view_22
    do: wait
    duration: 3
  - id: physics_view_23
    do: hide
    run_time: 1
    target: [len_brace, dir_lbl]
    style: fade
  - id: physics_view_24
    do: move
    caption: Slide it somewhere else without turning or stretching it...
    run_time: 1.5
    target: arrow
    by: [-2.5, 2]
  - id: physics_view_25
    do: move
    run_time: 1.5
    target: arrow
    by: [4.5, -3.5]
  - id: physics_view_26
    do: move
    caption: '...and, as far as physics cares, nothing has changed.'
    run_time: 1.5
    target: arrow
    by: [-2, 1.5]
  - id: physics_view_27
    do: wait
    duration: 3
  - id: physics_view_28
    do: show
    caption: 'Equal length, equal direction: every one of these is the same vector.'
    run_time: 2
    target: [copy_a, copy_b, copy_c, copy_d]
    style: grow
    lag: 0.3
  - id: physics_view_29
    do: wait
    duration: 4
  - id: physics_view_30
    do: wait
    caption: Arrows confined to a flat plane are 2D vectors; in space, 3D.
    duration: 4.5
  - id: physics_view_31
    do: clear
    run_time: 1.5
- id: cs_view
  title: The computer science student
  objects:
  - id: cs_head
    type: text
    place:
      edge: top
      buff: 0.5
    text: Computer science student
    font_size: 40
  - id: house_body
    type: square
    color: TEAL_B
    place:
      at: [-4.4, -0.6]
    fill: TEAL_E
    fill_opacity: 0.6
  - id: house_roof
    type: polygon
    color: RED_B
    points: [[-5.7, 0.4], [-3.1, 0.4], [-4.4, 1.7]]
    fill: RED_E
    fill_opacity: 0.6
  - id: house_door
    type: rectangle
    color: GREY_A
    place:
      at: [-4.4, -1.15]
    width: 0.5
    height: 0.9
    fill: GREY_BROWN
    fill_opacity: 0.8
  - id: house
    type: group
    members: [house_body, house_roof, house_door]
  - id: feat_area
    type: text
    place:
      at: [2.2, 0.8]
    text: 'Floor area: 2,600 sq ft'
    font_size: 32
  - id: feat_price
    type: text
    place:
      next_to: feat_area
      buff: 0.45
    text: 'Price: $300,000'
    font_size: 32
  - id: features
    type: group
    members: [feat_area, feat_price]
  - id: hvec
    type: matrix
    place:
      at: [1.1, 0.1]
    entries: [['2{,}600 \text{ ft}^2'], ['\$300{,}000']]
  - id: lbl_area
    type: text
    color: GREY_A
    place:
      next_to: hvec
      side: right
      buff: 0.5
      shift: [0, 0.42]
    text: floor area
    font_size: 28
  - id: lbl_price
    type: text
    color: GREY_A
    place:
      next_to: hvec
      side: right
      buff: 0.5
      shift: [0, -0.42]
    text: price
    font_size: 28
  - id: dim_brace
    type: brace
    target: hvec
    side: left
    label: \text{2 entries}
    buff: 0.15
  steps:
  - id: cs_view_1
    do: show
    caption: For the computer scientist, a vector is a list of numbers.
    run_time: 1.5
    target: cs_head
    style: write
  - id: cs_view_2
    do: wait
    duration: 4
  - id: cs_view_3
    do: show
    caption: Suppose you're studying houses, and record two facts about each.
    run_time: 2
    target: house
    style: draw
  - id: cs_view_4
    do: wait
    duration: 3.5
  - id: cs_view_5
    do: show
    caption: How much floor space it has...
    run_time: 1.5
    target: feat_area
    style: write
  - id: cs_view_6
    do: wait
    duration: 2
  - id: cs_view_7
    do: show
    caption: '...and what it sells for.'
    run_time: 1.5
    target: feat_price
    style: write
  - id: cs_view_8
    do: wait
    duration: 2
  - id: cs_view_9
    do: add
    target: features
  - id: cs_view_10
    do: transform
    caption: Then every house is summed up by two numbers.
    run_time: 2
    target: features
    into: hvec
    style: morph
  - id: cs_view_11
    do: show
    run_time: 1
    target: [lbl_area, lbl_price]
    style: fade
  - id: cs_view_12
    do: wait
    duration: 3
  - id: cs_view_13
    do: highlight
    caption: In this view, the list itself is the vector.
    run_time: 1.5
    target: hvec
  - id: cs_view_14
    do: wait
    duration: 3
  - id: cs_view_15
    do: show
    caption: It has two entries, so it counts as two-dimensional.
    run_time: 1.5
    target: dim_brace
  - id: cs_view_16
    do: wait
    duration: 4
  - id: cs_view_17
    do: wait
    caption: Here, "vector" is really just a grander name for a list.
    duration: 4
  - id: cs_view_18
    do: hide
    run_time: 1
    target: dim_brace
    style: fade
  - id: cs_view_19
    do: change
    caption: Swap the entries and it describes a very strange house.
    run_time: 2
    target: hvec
    set:
      entries: [['\$300{,}000'], ['2{,}600 \text{ ft}^2']]
  - id: cs_view_20
    do: wait
    duration: 3.5
  - id: cs_view_21
    do: change
    caption: So the order of the numbers matters.
    run_time: 1.5
    target: hvec
    set:
      entries: [['2{,}600 \text{ ft}^2'], ['\$300{,}000']]
  - id: cs_view_22
    do: wait
    duration: 4
  - id: cs_view_23
    do: clear
    run_time: 1.5
- id: math_view
  title: The mathematician
  objects:
  - id: m_head
    type: text
    place:
      edge: top
      buff: 0.5
    text: Mathematician
    font_size: 40
  - id: add_tex
    type: tex
    place:
      at: [-3.2, 1.6]
    tex: \vec{\mathbf{v}} + \vec{\mathbf{w}}
    font_size: 60
  - id: scale_tex
    type: tex
    place:
      at: [3.2, 1.6]
    tex: 2 \cdot \vec{\mathbf{v}}
    font_size: 60
  - id: add_word
    type: text
    color: GREY_A
    place:
      next_to: add_tex
      buff: 0.35
    text: adding
    font_size: 30
  - id: scale_word
    type: text
    color: GREY_A
    place:
      next_to: scale_tex
      buff: 0.35
    text: multiplying by a number
    font_size: 30
  - id: ex_arrow
    type: vector
    color: YELLOW
    tip: [-3.8, -0.7]
    tail: [-5.4, -2.3]
  - id: ex_list
    type: matrix
    place:
      at: [0, -1.5]
    entries: [[3], [1]]
    font_size: 36
  - id: ex_axes
    type: axes
    place:
      at: [4.6, -1.5]
    x_range: [-3, 3, 1]
    y_range: [-1, 1, 1]
    width: 3.2
    height: 1.4
    numbers: false
  - id: ex_graph
    type: graph
    color: BLUE
    on: ex_axes
    function: sin(2*x)
  steps:
  - id: math_view_1
    do: show
    caption: The mathematician tries to capture both views at once.
    run_time: 1.5
    target: m_head
    style: write
  - id: math_view_2
    do: wait
    duration: 3.5
  - id: math_view_3
    do: show
    caption: 'What matters is only what you can do with vectors:'
    run_time: 2
    target: [add_tex, add_word]
    style: write
  - id: math_view_4
    do: wait
    duration: 3
  - id: math_view_5
    do: show
    caption: add two of them, and multiply one by a number.
    run_time: 2
    target: [scale_tex, scale_word]
    style: write
  - id: math_view_6
    do: wait
    duration: 3.5
  - id: math_view_7
    do: show
    caption: Arrows allow both. So do lists of numbers.
    run_time: 2
    target: [ex_arrow, ex_list]
    lag: 0.5
  - id: math_view_8
    do: wait
    duration: 3
  - id: math_view_9
    do: show
    caption: So do stranger things, which turn up later in the series.
    run_time: 2
    target: [ex_axes, ex_graph]
    style: draw
    lag: 0.5
  - id: math_view_10
    do: wait
    duration: 4
  - id: math_view_11
    do: wait
    caption: That abstract view can wait. First, connect the other two.
    duration: 4.5
  - id: math_view_12
    do: clear
    run_time: 1.5
- id: coordinate_plane
  title: A coordinate system
  objects:
  - id: plane
    type: number_plane
    z: -1
  - id: x_axis
    type: number_line
    x_range: [-7, 7, 1]
    numbers: false
  - id: y_axis
    type: number_line
    rotate: 90
    x_range: [-4, 4, 1]
    numbers: false
  - id: x_name
    type: text
    color: GREEN
    place:
      at: [6.2, 0.4]
    text: x-axis
    font_size: 30
  - id: y_name
    type: text
    color: RED
    place:
      at: [0.9, 3.55]
    text: y-axis
    font_size: 30
  - id: origin_dot
    type: dot
    color: WHITE
    z: 2
    point: [0, 0]
    radius: 0.09
  - id: origin_lbl
    type: text
    place:
      at: [-0.85, -0.45]
    text: origin
    font_size: 30
  - id: unit_seg
    type: line
    color: YELLOW
    z: 1
    start: [0, 0]
    end: [1, 0]
    thickness: 6
  - id: unit_brace
    type: brace
    target: unit_seg
    label: '1'
    buff: 0.2
  - id: v
    type: vector
    color: YELLOW
    z: 1
    on: plane
    tip: [-2, 3]
  steps:
  - id: coordinate_plane_1
    do: show
    caption: From here on, vectors will live in a coordinate system.
    run_time: 2
    target: x_axis
    style: draw
  - id: coordinate_plane_2
    do: wait
    duration: 3
  - id: coordinate_plane_3
    do: show
    caption: 'One line runs across: the x-axis.'
    run_time: 1
    target: x_name
    style: write
  - id: coordinate_plane_4
    do: wait
    duration: 3
  - id: coordinate_plane_5
    do: together
    caption: 'Another runs straight up: the y-axis.'
    steps:
    - id: coordinate_plane_6
      do: show
      run_time: 2
      target: y_axis
      style: draw
    - id: coordinate_plane_7
      do: show
      run_time: 1
      target: y_name
      style: write
  - id: coordinate_plane_8
    do: wait
    duration: 2
  - id: coordinate_plane_9
    do: show
    caption: They meet at the origin, the centre of it all.
    run_time: 1
    target: origin_dot
    style: pop
  - id: coordinate_plane_10
    do: show
    run_time: 1
    target: origin_lbl
    style: write
  - id: coordinate_plane_11
    do: highlight
    run_time: 1.5
    target: origin_dot
    style: flash
  - id: coordinate_plane_12
    do: wait
    duration: 2
  - id: coordinate_plane_13
    do: together
    caption: Tick marks along each axis are one unit apart.
    steps:
    - id: coordinate_plane_14
      do: show
      run_time: 1.5
      target: unit_seg
      style: draw
    - id: coordinate_plane_15
      do: show
      run_time: 1.5
      target: unit_brace
  - id: coordinate_plane_16
    do: wait
    duration: 3.5
  - id: coordinate_plane_17
    do: wait
    caption: You choose how long a unit is, then stick with it.
    duration: 4
  - id: coordinate_plane_18
    do: hide
    run_time: 1
    target: [unit_seg, unit_brace, origin_lbl]
    style: fade
  - id: coordinate_plane_19
    do: show
    caption: A grid line through every tick makes positions easy to read.
    run_time: 3
    target: plane
    style: draw
  - id: coordinate_plane_20
    do: wait
    duration: 3
  - id: coordinate_plane_21
    do: show
    caption: Now draw a vector here, starting from the origin.
    run_time: 2
    target: v
    style: grow
  - id: coordinate_plane_22
    do: wait
    duration: 3.5
  - id: coordinate_plane_23
    do: wait
    caption: Unlike the physicist's arrows, this one's tail stays put at the origin.
    duration: 4.5
  - id: coordinate_plane_24
    do: hide
    run_time: 1
    target: [x_name, y_name]
    style: fade
- id: coordinates
  title: Coordinates as instructions
  objects:
  - id: plane
    type: number_plane
    z: -1
    shown: true
  - id: x_axis
    type: number_line
    shown: true
    x_range: [-7, 7, 1]
    numbers: false
  - id: y_axis
    type: number_line
    shown: true
    rotate: 90
    x_range: [-4, 4, 1]
    numbers: false
  - id: origin_dot
    type: dot
    color: WHITE
    z: 2
    shown: true
    point: [0, 0]
    radius: 0.09
  - id: v
    type: vector
    color: YELLOW
    z: 1
    shown: true
    on: plane
    tip: [-2, 3]
  - id: coords
    type: matrix
    place:
      at: [-3.5, 3]
    entries: [[-2], [3]]
    row_colors: [GREEN, RED]
  - id: x_step
    type: line
    color: GREEN
    z: 1
    on: plane
    start: [0, 0]
    end: [-2, 0]
    arrow: true
  - id: y_step
    type: line
    color: RED
    z: 1
    on: plane
    start: [-2, 0]
    end: [-2, 3]
    arrow: true
  - id: x_num
    type: tex
    color: GREEN
    place:
      at: [-1, -0.45]
    tex: '-2'
    font_size: 40
  - id: y_num
    type: tex
    color: RED
    place:
      at: [-2.4, 1.5]
    tex: '3'
    font_size: 40
  steps:
  - id: coordinates_1
    do: show
    caption: This vector's coordinates are the numbers -2 and 3.
    run_time: 1.5
    target: coords
    style: write
  - id: coordinates_2
    do: wait
    duration: 3.5
  - id: coordinates_3
    do: highlight
    caption: They are a recipe for getting from the tail to the tip.
    run_time: 1.5
    target: coords
  - id: coordinates_4
    do: wait
    duration: 3.5
  - id: coordinates_5
    do: wait
    caption: Stacking them in a column keeps vectors apart from points.
    duration: 4.5
  - id: coordinates_6
    do: show
    caption: The top entry is a distance along the x-axis.
    run_time: 1.5
    target: x_step
    style: draw
  - id: coordinates_7
    do: show
    run_time: 1
    target: x_num
    style: write
  - id: coordinates_8
    do: wait
    duration: 2
  - id: coordinates_9
    do: wait
    caption: 'It''s negative, so head left: two units.'
    duration: 4
  - id: coordinates_10
    do: show
    caption: 'The bottom entry: then travel parallel to the y-axis.'
    run_time: 1.5
    target: y_step
    style: draw
  - id: coordinates_11
    do: show
    run_time: 1
    target: y_num
    style: write
  - id: coordinates_12
    do: wait
    duration: 2
  - id: coordinates_13
    do: wait
    caption: 'It''s positive, so head up: three units.'
    duration: 4
  - id: coordinates_14
    do: highlight
    caption: The trip ends right at the tip of the arrow.
    run_time: 1.5
    target: v
  - id: coordinates_15
    do: wait
    duration: 3.5
  - id: coordinates_16
    do: hide
    caption: Any pair of numbers picks out a single vector...
    run_time: 1
    target: [x_step, y_step, x_num, y_num]
    style: fade
  - id: coordinates_17
    do: together
    steps:
    - id: coordinates_18
      do: change
      run_time: 2
      target: v
      set:
        tip: [3, 1]
    - id: coordinates_19
