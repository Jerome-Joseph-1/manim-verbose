    label_side: left
  - id: w
    type: vector
    color: PINK
    on: plane
    tip: [3, -1]
    label: \vec{\mathbf{w}}
    label_side: up
  - id: s
    type: vector
    color: ORANGE
    on: plane
    tip: [4, 1]
    label: \vec{\mathbf{v}} + \vec{\mathbf{w}}
  - id: walker
    type: dot
